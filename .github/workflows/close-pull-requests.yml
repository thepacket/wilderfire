# WilderFire does not accept pull requests (see CONTRIBUTING.md).
# GitHub cannot disable PRs on a public repo, so this closes them with a note.
name: Close pull requests
on:
  pull_request_target:
    types: [opened, reopened]
permissions:
  pull-requests: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            await github.rest.issues.createComment({
              owner, repo, issue_number,
              body: [
                'Thanks for taking the time — but WilderFire does not accept pull requests,',
                'so this is being closed automatically (see CONTRIBUTING.md).',
                '',
                'If it fixes a bug, please open an **issue** describing it (with a `.flame` if relevant).',
                'If you want to take the code somewhere else, the LGPL lets you fork it.',
              ].join('\n'),
            });
            await github.rest.pulls.update({ owner, repo, pull_number: issue_number, state: 'closed' });
