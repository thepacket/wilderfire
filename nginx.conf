server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Bundled .flame sample files change rarely
    location /flames/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # the PWA manifest (nginx's default mime table has no .webmanifest entry)
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # index.html and the service worker (sw.js) must always revalidate so deploys take effect immediately
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
